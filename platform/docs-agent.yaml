# docs-agent: a second Agent on our own hello-harness (Recipe 2 in docs/building-on-the-platform.md).
# Same image as hello-agent, its own template, so its own actor and sessions. No key or token
# here: the model goes through agentgateway and the agent holds no git credential.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: {name: docs-agent, namespace: agents}
spec:
  description: Fixes documentation files only
  modelConfig: {name: default-model-config}
  # Short on purpose: the agent adds its own rules (tools, verification, ask_user).
  systemPrompt: You fix documentation (Markdown files). Never change code files. Change only what the task asks for.
  # One skill from an OCI image that kagent mounts read-only; platform/deploy.sh builds and pins it.
  skills:
    - name: docs-style
      source: {oci: "@DOCS_SKILL_IMAGE@"}
  tools:
    - subAgent:
        name: explorer
        description: Read-only helper that finds and reads files.
        templateRef: {name: explorer-template}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: docs-agent, namespace: agents}
spec:
  template: {ref: {name: docs-agent}}
  harnessRef: {name: hello-harness}
  egressPolicyRefs: [{name: agent-git-egress}]
