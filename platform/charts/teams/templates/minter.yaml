{{- /*
The platform's minter (agent/src/minter/): a CronJob in platform-system that runs every
minute and gives each registered agent of a listed team its own model key, token cap and MCP
tool policy. Its source comes in as values (install.sh --set-file
minter.source.<file>=agent/src/minter/<file>.ts) and runs on the pinned node image with no
dependencies. Its RBAC covers only what it writes: in each team namespace, the registration
ConfigMaps (list) and Secrets (list, create, update, delete); in agentgateway-system, the
API-key ConfigMap and the ratelimit config ConfigMap, each by name, and AgentgatewayPolicies
(list, create, patch, delete). Nothing cluster-wide.
*/ -}}
{{- $ns := "platform-system" }}
{{- $apiKeys := "agent-api-keys" }}
{{- $agwNs := "agentgateway-system" }}
{{- $rateLimit := "ratelimit-config" }}
{{- if and .Values.minter.image .Values.minter.source }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.minter.image) }}
{{- fail (printf "minter.image %s must be pinned by digest" .Values.minter.image) }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minter
  namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minter-src
  namespace: {{ $ns }}
data:
  # Node runs the .ts files as ES modules (type stripping).
  package.json: '{"type":"module"}'
  {{- range $file, $src := .Values.minter.source }}
  {{ $file }}.ts: {{ $src | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-budgets
  namespace: {{ $ns }}
data:
  budgets.json: {{ toJson .Values.budgets | quote }}
{{- range $team := .Values.teams }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minter
  namespace: team-{{ $team }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minter
  namespace: team-{{ $team }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minter
subjects:
  - kind: ServiceAccount
    name: minter
    namespace: {{ $ns }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minter
  namespace: {{ $agwNs }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $apiKeys }}]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $rateLimit }}]
    verbs: [get, patch]
  # The agents' MCP tool policies (mcp-tools.<team>.<agent>). Kubernetes cannot limit create
  # by name; the minter lists, changes and deletes only the policies it labels as its own.
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaypolicies]
    verbs: [list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minter
  namespace: {{ $agwNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minter
subjects:
  - kind: ServiceAccount
    name: minter
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minter
  namespace: {{ $ns }}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 55
      template:
        metadata:
          annotations:
            # A new source rolls the next run's pod; the source is what runs.
            checksum/source: {{ toJson .Values.minter.source | sha256sum }}
            checksum/budgets: {{ toJson .Values.budgets | sha256sum }}
        spec:
          serviceAccountName: minter
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: minter
              image: {{ .Values.minter.image | quote }}
              command: ["node", "/minter/main.ts"]
              env:
                - {name: MINTER_TEAMS, value: {{ join "," .Values.teams | quote }}}
                - {name: MINTER_API_KEYS_NAMESPACE, value: {{ $agwNs }}}
                - {name: MINTER_API_KEYS_CONFIGMAP, value: {{ $apiKeys }}}
                # The catalog MCP backends of platform/gateway.yaml that each agent's tool policy covers.
                - {name: MINTER_MCP_POLICY_NAMESPACE, value: {{ $agwNs }}}
                - {name: MINTER_MCP_BACKENDS, value: "github-mcp,demo-mcp"}
                - {name: MINTER_RATELIMIT_NAMESPACE, value: {{ $agwNs }}}
                - {name: MINTER_RATELIMIT_CONFIGMAP, value: {{ $rateLimit }}}
                - {name: MINTER_BUDGETS_FILE, value: /budgets/budgets.json}
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: src, mountPath: /minter, readOnly: true}
                - {name: budgets, mountPath: /budgets, readOnly: true}
          volumes:
            - name: src
              configMap: {name: minter-src}
            - name: budgets
              configMap: {name: team-budgets}
{{- end }}
