# install.sh sets teams from platform/teams.txt and workerImage from platform/versions.env.
teams: []
workerImage: ""
# make deploy sets these: the coding image (the team bases' Harness coding) and each skill's
# image (passed to every Application), by digest on the registry's kind-network address.
images:
  coding: ""
  skills: {}
# install.sh sets these: the node image the minter runs on (platform/versions.env NODE_IMAGE)
# and its source, file name (no .ts) to text, from agent/src/minter/.
minter:
  image: ""
  source: {}
# install.sh sets this from platform/budgets.txt: each team's monthly token budget. A team
# with none gets no keys.
budgets: {}
argocdNamespace: argocd
gitops:
  repoURL: https://github.com/dackota/build-coding-agent.git
  revision: main
