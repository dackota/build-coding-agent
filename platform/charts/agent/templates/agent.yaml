{{- include "agent.check" . -}}
# stock: kagent's built-in runtime on the team base's Harness kagent-stock, which runs on
# the team's WorkerPool.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  description: {{ .Values.description | default "" | quote }}
  modelConfig:
    name: {{ include "agent.modelConfig" . }}
  systemPrompt: {{ .Values.systemPrompt | quote }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  template:
    ref:
      name: {{ .Values.name }}
  harnessRef:
    name: kagent-stock
