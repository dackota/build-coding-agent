{{- include "agent.check" . -}}
# stock: kagent's built-in runtime on the team base's Harness kagent-stock. coding: the
# platform's coding agent on the team base's Harness coding (its image pinned by make
# deploy), with git and npm egress. Both run on the team's WorkerPool.
{{- $isCoding := eq .Values.runtime "coding" }}
{{- $tools := include "agent.tools" . }}
{{- $skills := include "agent.skills" . }}
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  description: {{ .Values.description | default "" | quote }}
  modelConfig:
    name: {{ include "agent.modelConfig" . }}
  systemPrompt: {{ .Values.systemPrompt | quote }}
  {{- if $skills }}
  skills:
    {{- $skills | trim | nindent 4 }}
  {{- end }}
  {{- if $tools }}
  tools:
    {{- $tools | trim | nindent 4 }}
  {{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  template:
    ref:
      name: {{ .Values.name }}
  harnessRef:
    name: {{ ternary "coding" "kagent-stock" $isCoding }}
  {{- if $isCoding }}
  egressPolicyRefs:
    - name: git-egress
    - name: npm-egress
  {{- end }}
