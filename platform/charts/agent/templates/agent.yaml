{{- include "agent.check" . -}}
# stock: kagent's built-in runtime on the team base's Harness kagent-stock. coding: the
# platform's coding agent on the team base's Harness coding (its image pinned by make
# deploy), with git and npm egress. Both run on the team's WorkerPool.
{{- $isCoding := eq .Values.runtime "coding" }}
{{- $tools := include "agent.tools" . }}
{{- $skills := include "agent.skills" . }}
# The agent's own key: the platform's minter writes Secret <name>-agent-key in this namespace
# within about a minute and puts the key's hash in agentgateway's API-key ConfigMap. The actor
# gets only kagent's placeholder; Substrate's egress gateway adds the key as the call leaves.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: {{ include "agent.modelConfig" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  provider: OpenAI
  model: {{ .Values.model | quote }}
  apiKeySecret: {{ include "agent.keySecret" . }}
  apiKeySecretKey: OPENAI_API_KEY
  stream: true
  openAI:
    apiFormat: chatCompletions
    baseUrl: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/v1
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  description: {{ .Values.description | default "" | quote }}
  modelConfig:
    name: {{ include "agent.modelConfig" . }}
  systemPrompt: {{ .Values.systemPrompt | quote }}
  {{- if $skills }}
  skills:
    {{- $skills | trim | nindent 4 }}
  {{- end }}
  {{- if $tools }}
  tools:
    {{- $tools | trim | nindent 4 }}
  {{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  template:
    ref:
      name: {{ .Values.name }}
  harnessRef:
    name: {{ ternary "coding" "kagent-stock" $isCoding }}
  {{- if $isCoding }}
  egressPolicyRefs:
    - name: git-egress
    - name: npm-egress
  {{- end }}
