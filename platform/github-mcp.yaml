# The GitHub MCP server for git out: the agent creates a branch, pushes files, and opens a
# pull request through it. github-mcp-server (http mode, only the four tools below) wants a
# GitHub token on every request and refuses one without it. This namespace holds no token.
# Each team base has a RemoteMCPServer github-mcp for it (platform/charts/teams/templates/coding.yaml)
# whose Authorization header comes from Secret github-mcp-token in the team's namespace (made
# by deploy.sh from GITHUB_TOKEN in .env, value "Bearer <token>"). kagent puts only
# __KAGENT_ENV[KAGENT_CREDENTIAL_<hash>]__ in the agent's config and the placeholder
# kagent-credential-injected in the actor's env; Substrate's egress gateway swaps the
# placeholder for the Secret as the request leaves the actor. So the token is never in the
# actor, its config, or this pod's spec, and a pod with no token gets refused.
# The catalog tool github-write binds create_branch, push_files and create_pull_request with
# requireApproval, so each call the model makes pauses for the user; github-read binds
# issue_read. The implement loop (agent/src/loop-github.ts) calls issue_read, and its three
# fixed git calls, from code.
apiVersion: v1
kind: Namespace
metadata: {name: github-mcp}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: github-mcp, namespace: github-mcp}
spec:
  replicas: 1
  selector: {matchLabels: {app: github-mcp}}
  template:
    metadata: {labels: {app: github-mcp}}
    spec:
      containers:
        - name: server
          # deploy.sh fills in GITHUB_MCP_IMAGE from platform/versions.env.
          image: "@GITHUB_MCP_IMAGE@"
          args: ["http", "--listen-host=0.0.0.0", "--port=8080", "--tools=issue_read,create_branch,push_files,create_pull_request"]
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: github-mcp, namespace: github-mcp}
spec:
  selector: {app: github-mcp}
  ports: [{port: 8080, targetPort: 8080}]
