# kagent's stock agent: the built-in `kagent` runtime with the release's own image
# (no workload.image, so the chart's digest-pinned golang-adk image is used), on the
# chart's default ModelConfig, which reaches the model through agentgateway.
# Shapes follow kagent v1.0.0-alpha17 go/core/test/e2e/manifests/lifecycle.yaml.tmpl.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata: {name: kagent-stock, namespace: kagent}
spec:
  kagent: {}
  substrate:
    workerPoolRef: {name: kagent-default}
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: {name: stock-agent, namespace: kagent}
spec:
  description: kagent's stock runtime, answering through agentgateway
  modelConfig: {name: default-model-config}
  systemPrompt: You are a concise, helpful assistant. Reply briefly.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: stock-agent, namespace: kagent}
spec:
  template:
    ref: {name: stock-agent}
  harnessRef: {name: kagent-stock}
